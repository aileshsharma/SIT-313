<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deakin Newsletter</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white">

    <div class="w-96 mx-auto mt-20">

        <h1 class="text-3xl font-bold text-black mb-10">
            Sign up to Deakin<br>
            Newsletter
        </h1>

        <form action="/" method="POST">

            <label class="block text-lg font-semibold text-black mb-2">
                First Name
            </label>

            <input
                type="text"
                name="firstName"
                placeholder="Enter your first name"
                required
                class="w-full border-2 border-gray-300 rounded-xl p-3 mb-5"
            >

            <label class="block text-lg font-semibold text-black mb-2">
                Last Name
            </label>

            <input
                type="text"
                name="lastName"
                placeholder="Enter your last name"
                required
                class="w-full border-2 border-gray-300 rounded-xl p-3 mb-5"
            >

            <label class="block text-lg font-semibold text-black mb-2">
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
                class="w-full border-2 border-gray-300 rounded-xl p-3 mb-5"
            >

            <button
                type="submit"
                class="border-2 border-gray-300 rounded-xl px-4 py-2 text-black font-bold text-lg hover:bg-gray-100"
            >
                Sign Up
            </button>

        </form>

    </div>

</body>

</html>
